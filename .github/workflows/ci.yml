name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        # Xcode's toolchain ships Swift Testing, so plain `swift test` works on
        # CI (the Makefile's framework copy is only needed on the Command Line
        # Tools-only dev machine).
        run: swift test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        # The whole repo, not just `windows/`, because
        # `tests/languageCatalog.test.ts` compares the Windows catalog against the
        # macOS one and skips silently if the Swift source is absent. Without a full
        # checkout that check would pass by doing nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.main.json

      - name: Unit tests
        run: npx vitest run

      # The icon is a gitignored build artifact, so packaging fails on a fresh clone
      # without this. It also proves the generator still works from nothing.
      - name: Generate icon
        run: npm run build:icon

      # `electron-builder` packages `dist/**` as-is; it does not compile anything. The
      # first version of this job went straight from tests to packaging and failed with
      # "Application entry file dist\\main\\index.js ... does not exist", because
      # nothing had built it.
      - name: Build
        run: npm run build

      # The redesign end to end on a real Windows desktop: Playwright drives the built
      # app (hidden windows, fixture data, no tray or hotkeys) through filter, search,
      # Teach a fix and the dark theme. The report and screenshots are kept.
      # TEMP DIAG (remove before merge): do windows load on the runner without Playwright?
      - name: DIAG self-test without Playwright
        continue-on-error: true
        timeout-minutes: 3
        run: |
          npx electron . --self-test --report=self-test-report.txt
          "exit $LASTEXITCODE"
          Get-Content self-test-report.txt

      - name: DIAG e2e mode without Playwright
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'uvdiag'
          New-Item -ItemType Directory -Force $d | Out-Null
          $exe = node -p "require('electron')"
          $main = Join-Path (Get-Location) 'dist\main\index.js'
          $p = Start-Process -FilePath $exe -ArgumentList @($main, "--uv-data-dir=$d", '--e2e') -PassThru
          Start-Sleep -Seconds 25
          Get-Content (Join-Path $d 'e2e.log')
          Stop-Process -Id $p.Id -Force

      - name: DIAG Playwright without video
        continue-on-error: true
        timeout-minutes: 4
        env:
          E2E_NO_VIDEO: '1'
          E2E_OUT: e2e-results-novideo
        run: npx playwright test

      - name: E2E
        run: npx playwright test

      - name: E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e
          path: windows/e2e-results
          if-no-files-found: ignore

      - name: Package
        run: npx electron-builder --win --publish never
