name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        # Xcode's toolchain ships Swift Testing, so plain `swift test` works on
        # CI (the Makefile's framework copy is only needed on the Command Line
        # Tools-only dev machine).
        run: swift test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        # The whole repo, not just `windows/`, because
        # `tests/languageCatalog.test.ts` compares the Windows catalog against the
        # macOS one and skips silently if the Swift source is absent. Without a full
        # checkout that check would pass by doing nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.main.json

      - name: Unit tests
        run: npx vitest run

      # The icon is a gitignored build artifact, so packaging fails on a fresh clone
      # without this. It also proves the generator still works from nothing.
      - name: Generate icon
        run: npm run build:icon

      # `electron-builder` packages `dist/**` as-is; it does not compile anything. The
      # first version of this job went straight from tests to packaging and failed with
      # "Application entry file dist\\main\\index.js ... does not exist", because
      # nothing had built it.
      - name: Build
        run: npm run build

      # The spec records a video, and Playwright encodes it with its own ffmpeg build,
      # which `npm ci` does not fetch. Without it the video recorder throws while
      # Playwright attaches to each window, before it resumes the renderer, so every
      # window hangs at "start loading" and the run times out with blank pages.
      - name: Install Playwright ffmpeg
        run: npx playwright install ffmpeg

      # The redesign end to end on a real Windows desktop: Playwright drives the built
      # app (hidden windows, fixture data, no tray or hotkeys) through filter, search,
      # Teach a fix and the dark theme. The report and screenshots are kept.
      - name: E2E
        run: npx playwright test

      - name: E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e
          path: windows/e2e-results
          if-no-files-found: ignore

      - name: Package
        run: npx electron-builder --win --publish never

  # An install made under the old Karko appId must be replaced, not duplicated, by
  # the current installer. electron-builder derives the NSIS uninstall key from
  # `build.nsis.guid` (pinned to the old appId's GUID), so this builds the legacy
  # identity as 0.0.1, installs it, then installs the current build over it.
  windows-upgrade:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate icon and build
        run: |
          npm run build:icon
          npm run build

      # The legacy config is the current build config minus the pinned nsis.guid, so
      # electron-builder derives the GUID from the old appId exactly as it did for real
      # old installs. The "same uninstall key" assertion below then proves the pin.
      - name: Build legacy-identity installer (0.0.1)
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = (Get-Content package.json -Raw | ConvertFrom-Json).build
          $cfg.appId = 'ai.karko.usefulvoice'
          $cfg.nsis.PSObject.Properties.Remove('guid')
          if ($cfg.nsis.PSObject.Properties['guid']) { throw 'guid still present in legacy config' }
          $cfg.extraMetadata | Add-Member -NotePropertyName version -NotePropertyValue '0.0.1' -Force
          $cfg.directories.output = 'release-old'
          $cfg | ConvertTo-Json -Depth 20 | Set-Content legacy-builder.json -Encoding utf8
          npx electron-builder --win nsis --publish never --config legacy-builder.json
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed: $LASTEXITCODE" }

      - name: Build current installer
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = (Get-Content package.json -Raw | ConvertFrom-Json).build
          $cfg.directories.output = 'release-new'
          $cfg | ConvertTo-Json -Depth 20 | Set-Content current-builder.json -Encoding utf8
          npx electron-builder --win nsis --publish never --config current-builder.json
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed: $LASTEXITCODE" }

      - name: Install old, install new over it, assert one entry
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          # Tests the default per-user install (oneClick false, perMachine false). The entry
          # count spans HKCU and both HKLM views so a stray all-users entry fails the job.
          $roots = @(
            @{ Hive = 'HKCU'; Path = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' },
            @{ Hive = 'HKLM'; Path = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' },
            @{ Hive = 'HKLM32'; Path = 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' }
          )
          $dump = Join-Path $env:RUNNER_TEMP 'uninstall-entries.txt'
          function Get-UvEntries {
            foreach ($r in $roots) {
              Get-ChildItem $r.Path -ErrorAction SilentlyContinue | ForEach-Object {
                $p = Get-ItemProperty $_.PSPath
                if ($p.DisplayName -like 'Useful Voice*') {
                  [pscustomobject]@{ Hive = $r.Hive; Key = $_.PSChildName; DisplayName = $p.DisplayName; DisplayVersion = $p.DisplayVersion; InstallLocation = $p.InstallLocation }
                }
              }
            }
          }
          function Show-Entries($label, $entries) {
            "== $label ==" | Tee-Object -FilePath $dump -Append
            ($entries | Format-List | Out-String) | Tee-Object -FilePath $dump -Append
          }
          # Run 38395434378 attempt 1 saw the legacy installer die with 0xC0000005 two seconds in,
          # before writing anything; the same tree passed on the same image version 10 minutes
          # earlier and on the re-run. Any non-zero exit saves what Windows knows about the crash
          # (WER events name the faulting module) so the next one can be root-caused.
          $diagDir = Join-Path $env:RUNNER_TEMP 'installer-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          $accessViolation = -1073741819  # 0xC0000005 as a signed exit code
          function Test-ExclusiveOpen($path) {
            try { $fs = [System.IO.File]::Open($path, 'Open', 'Read', 'None'); $fs.Dispose(); 'ok' }
            catch { "failed ($($_.Exception.InnerException.Message ?? $_.Exception.Message))" }
          }
          function Start-Installer($exe) {
            $age = [int]((Get-Date) - $exe.LastWriteTime).TotalSeconds
            Write-Host "Launching $($exe.Name): $($exe.Length) bytes, written ${age}s ago, exclusive open: $(Test-ExclusiveOpen $exe.FullName)"
            $since = Get-Date
            $proc = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -PassThru
            if (-not $proc.WaitForExit(180000)) {
              $diag = (Get-Process | Where-Object { $_.Id -eq $proc.Id -or $_.ProcessName -like '*Useful Voice*' } | Format-Table Id, ProcessName, StartTime | Out-String)
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Installer $($exe.Name) (PID $($proc.Id)) did not exit within 180s. Related processes:`n$diag"
            }
            Write-Host "$($exe.Name) (PID $($proc.Id)) exited with $($proc.ExitCode) after $([int]((Get-Date) - $since).TotalSeconds)s"
            [pscustomobject]@{ Proc = $proc; Since = $since }
          }
          # Every section records its own failure so a broken probe never replaces the real error.
          function Save-InstallerDiagnostics($exe, $run) {
            $proc = $run.Proc; $since = $run.Since.AddSeconds(-5)
            $out = Join-Path $diagDir "$($exe.BaseName)-pid$($proc.Id).txt"
            $section = {
              param($title, $probe)
              "== $title ==" | Add-Content $out
              try { (& $probe | Out-String -Width 400) | Add-Content $out }
              catch { "probe failed: $($_.Exception.Message)" | Add-Content $out }
            }
            ('{0} PID {1} (0x{1:x}) exited with {2} (0x{2:X8})' -f $exe.FullName, $proc.Id, $proc.ExitCode) | Set-Content $out
            # WER logs Application Error 1000 (faulting module, offset) a few seconds after the crash.
            & $section 'Application Error / WER events' {
              $events = @()
              for ($i = 0; $i -lt 15 -and $events.Count -eq 0; $i++) {
                $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since; ProviderName = 'Application Error', 'Windows Error Reporting' } -ErrorAction SilentlyContinue)
                if ($events.Count -eq 0) { Start-Sleep -Seconds 1 }
              }
              if ($events.Count) { $events | Format-List TimeCreated, ProviderName, Id, Message } else { 'none within 15s' }
            }
            & $section 'Defender status' { Get-MpComputerStatus | Format-List AMServiceEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, AMProductVersion, AntivirusSignatureVersion }
            & $section 'Defender operational events' { Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Windows Defender/Operational'; StartTime = $since } -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message }
            & $section 'NSIS plugin dirs left in TEMP (shows how far the installer got)' { Get-ChildItem $env:TEMP -Directory -Filter 'ns*.tmp' | Where-Object { $_.LastWriteTime -ge $since } | Get-ChildItem -Recurse | Format-Table FullName, Length, LastWriteTime }
            & $section 'Install dir' { $d = Join-Path $env:LOCALAPPDATA 'Programs\Useful Voice'; if (Test-Path $d) { "$((Get-ChildItem $d -Recurse -File).Count) files in $d" } else { "$d does not exist" } }
            & $section 'Uninstall entries' { Get-UvEntries | Format-List }
            & $section 'WER report files' {
              $werRoots = "$env:ProgramData\Microsoft\Windows\WER\ReportArchive", "$env:ProgramData\Microsoft\Windows\WER\ReportQueue", "$env:LOCALAPPDATA\Microsoft\Windows\WER\ReportArchive", "$env:LOCALAPPDATA\Microsoft\Windows\WER\ReportQueue"
              Get-ChildItem $werRoots -Recurse -Filter 'Report.wer' -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -ge $since } | ForEach-Object {
                Copy-Item $_.FullName (Join-Path $diagDir "$($_.Directory.Name).wer"); $_.FullName
              }
            }
            Get-Content $out | Write-Host
            $out
          }
          # $retryOnCrash is set only for the legacy 0.0.1 installer, which is test scaffolding we
          # never ship. It retries once, and only on 0xC0000005, with a warning annotation and the
          # diagnostics saved. A crash of the shipped installer, a second crash or any other
          # non-zero exit fails the job.
          function Install-Silent($dir, [switch]$retryOnCrash) {
            $exe = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -like 'Useful Voice-*' } | Select-Object -First 1
            if (-not $exe) { throw "No installer found in $dir" }
            $run = Start-Installer $exe
            if ($run.Proc.ExitCode -eq $accessViolation -and $retryOnCrash) {
              $report = Save-InstallerDiagnostics $exe $run
              Write-Host "::warning title=Legacy installer crashed (0xC0000005), retrying once::$($exe.Name) PID $($run.Proc.Id) crashed with an access violation. Diagnostics in the windows-upgrade-registry artifact ($(Split-Path $report -Leaf)). Retrying once."
              Write-Host "RETRYING $($exe.Name) ONCE AFTER 0xC0000005"
              $run = Start-Installer $exe
            }
            if ($run.Proc.ExitCode -ne 0) {
              $report = Save-InstallerDiagnostics $exe $run
              throw "Installer $($exe.Name) exited with $($run.Proc.ExitCode). Diagnostics: $report"
            }
          }

          $newVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version

          Install-Silent 'release-old' -retryOnCrash
          # TEMP verification: dump diagnostics once on the success path so the Windows probes are exercised. Reverted before merge.
          $exeOld = Get-ChildItem 'release-old' -Filter 'Useful Voice-*.exe' | Select-Object -First 1
          Save-InstallerDiagnostics $exeOld ([pscustomobject]@{ Proc = [pscustomobject]@{ Id = 0; ExitCode = 0 }; Since = (Get-Date).AddMinutes(-3) }) | Out-Null
          $old = @(Get-UvEntries)
          Show-Entries 'after old install' $old
          if ($old.Count -ne 1 -or $old[0].Hive -ne 'HKCU') { throw "Expected 1 HKCU Useful Voice entry after the old install, found $($old.Count): $(($old | ForEach-Object { $_.Hive + ':' + $_.Key }) -join ', ')" }
          if ($old[0].DisplayVersion -ne '0.0.1') { throw "Expected DisplayVersion 0.0.1, found $($old[0].DisplayVersion)" }

          Install-Silent 'release-new'
          $new = @(Get-UvEntries)
          Show-Entries 'after upgrade' $new
          if ($new.Count -ne 1) { throw "Expected exactly 1 Useful Voice entry after the upgrade, found $($new.Count): $(($new | ForEach-Object { $_.Hive + ':' + $_.Key }) -join ', ')" }
          if ($new[0].DisplayVersion -ne $newVersion) { throw "Expected DisplayVersion $newVersion, found $($new[0].DisplayVersion)" }
          if ($new[0].Key -ne $old[0].Key) { throw "Upgrade used a different uninstall key: $($old[0].Key) -> $($new[0].Key)" }

          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Useful Voice\Useful Voice.exe'
          if (-not (Test-Path $installed)) {
            $loc = $new[0].InstallLocation
            if ($loc) { $installed = Join-Path $loc 'Useful Voice.exe' }
          }
          if (-not (Test-Path $installed)) { throw "Installed Useful Voice.exe not found at $installed" }
          "OK: one entry $($new[0].Key), version $($new[0].DisplayVersion), exe $installed" | Tee-Object -FilePath $dump -Append

      - name: Upload registry dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-registry
          path: |
            ${{ runner.temp }}/uninstall-entries.txt
            ${{ runner.temp }}/installer-diagnostics/
          if-no-files-found: ignore
