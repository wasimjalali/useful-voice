<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      A strict CSP. There is no remote content, no inline script and no eval, so
      the renderer cannot pull in anything the app did not ship.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'"
    />
    <title>Useful Voice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="renderer.js" type="module"></script>
  </body>
</html>
